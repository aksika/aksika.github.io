name: Deploy docs

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wiki-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: aksika/abmind
          ref: dev
          path: _abmind
          sparse-checkout: |
            docs/wiki

      - uses: actions/checkout@v4
        with:
          repository: aksika/abtars
          ref: dev
          path: _abtars
          sparse-checkout: |
            docs/wiki

      - name: Assemble wiki sources
        run: |
          rm -rf docs/abtars docs/abmind
          mkdir -p docs/abtars docs/abmind
          cp -rf _abtars/docs/wiki/* docs/abtars/
          cp -rf _abmind/docs/wiki/* docs/abmind/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
